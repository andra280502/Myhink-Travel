<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Myhink Travel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Selamat Datang</h2>
            <form action="dashboard.html">
                <input type="email" class="input-group" placeholder="Email Address" required>
                <input type="password" class="input-group" placeholder="Password" required>
                <button type="submit" class="btn-primary" style="width: 100%;">Log In</button>
            </form>
            <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
        </div>
    </div>
</body>
</html>
